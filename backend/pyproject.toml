[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crisalid-benchmark"
version = "0.1.0"
description = "Bibliometric benchmarking tool for academic institutions"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "tenacity>=8.3",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "pycountry>=24.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]