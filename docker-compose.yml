services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crisalid_benchmark
      POSTGRES_USER: crisalid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crisalid -d crisalid_benchmark"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://crisalid:${POSTGRES_PASSWORD:-devpassword}@db:5432/crisalid_benchmark
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-prod}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      VLLM_MODEL: ${VLLM_MODEL:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - leiden_uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Must be a browser-reachable URL (the published host port), not the
        # in-network service name — this gets baked into the client bundle at
        # build time. See Dockerfile comment for why this can't just be an
        # `environment:` var here.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    # No restart policy: unlike the app's own services, Adminer is a manual,
    # on-demand DB inspection tool — it shouldn't come back up unattended
    # after a crash or host reboot (an unauthenticated DB UI on 8080), and it
    # isn't required for the app itself to run. Start it explicitly when needed.
    restart: "no"

volumes:
  postgres_data:
  leiden_uploads: